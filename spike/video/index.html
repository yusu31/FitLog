<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>video spike</title>
  <style>body { font: 14px monospace; padding: 12px; } video { width: 240px; margin: 4px; }</style>
</head>
<body>
  <h1>video spike</h1>
  <div id="videos"></div>
  <pre id="out">RUNNING</pre>
  <script>
    const targets = [
      ["h264.mp4", 'video/mp4; codecs="avc1.640028"'],
      ["hevc.mov", 'video/mp4; codecs="hvc1.1.6.L93.B0"'],
      ["vp9.webm", 'video/webm; codecs="vp9"'],
    ];
    const lines = [];

    function test(name, mime) {
      return new Promise((resolve) => {
        const v = document.createElement("video");
        v.muted = true;
        v.playsInline = true;
        v.controls = true;
        v.src = name;
        document.getElementById("videos").appendChild(v);
        const can = v.canPlayType(mime) || "(empty)";
        let done = false;
        const finish = (result) => {
          if (done) return;
          done = true;
          lines.push(`${name}: canPlayType=${can} | ${result}`);
          resolve();
        };
        v.addEventListener("error", () => finish(`ERROR code=${v.error?.code} msg=${v.error?.message}`));
        v.addEventListener("loadeddata", async () => {
          try {
            await v.play();
            setTimeout(() => finish(`PLAYED ok, videoWidth=${v.videoWidth}, currentTime=${v.currentTime.toFixed(2)}`), 1500);
          } catch (e) {
            finish(`play() rejected: ${e.name}`);
          }
        });
        setTimeout(() => finish("TIMEOUT (no loadeddata, no error)"), 6000);
      });
    }

    (async () => {
      for (const [n, m] of targets) await test(n, m);
      document.getElementById("out").textContent = "DONE\n" + lines.join("\n");
    })();
  </script>
</body>
</html>
