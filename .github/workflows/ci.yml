name: CI

# push と PR のたびに自動で走る。ここに書いた検査が全部緑になるまでマージしない運用にする。
# バックエンドのジョブ（lint・型チェック・テスト・ビルド）は 02-1 ① で追加した。画面のジョブも 02-1 ② で足した。
on:
  pull_request:
  push:
    branches: [main]

# 使う部品（Actions）はタグではなくコミットの SHA（中身の指紋）で固定する。タグは付け替えられるため（2026年に乗っ取りが続いた）。
# 版は行末のコメントに書く。新しい版への更新は Dependabot が PR を出す（.github/dependabot.yml）。docs/dev-harness.md 4章。
# checkout は persist-credentials: false（GitHub の鍵を作業フォルダに残さない。後の手順が乗っ取られても鍵を持ち出せない）。
permissions:
  contents: read

jobs:
  secret-scan:
    name: 秘密情報の検査（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する（履歴ぜんぶ）
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 秘密情報が含まれていないか検査する
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: バックエンド（lint・型・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # 結合テスト用の本物の PostgreSQL（本番は Neon。バージョンはローカルの docker-compose.yml と同じ）
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: fitlog
          POSTGRES_PASSWORD: fitlog
          POSTGRES_DB: fitlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitlog -d fitlog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # 本番の Neon の -pooler（PgBouncer のトランザクションモード）と同じ制約で結合テストをする窓口。
      # 設定はローカルの docker-compose.yml と同じ。postgres（上のサービス名）につなぐ
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
        env:
          DB_HOST: postgres
          DB_USER: fitlog
          DB_PASSWORD: fitlog
          DB_NAME: fitlog
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "1"
          MAX_CLIENT_CONN: "50"
        ports:
          - 6432:5432
    env:
      # アプリ・結合テストは PgBouncer 経由。表の作成（マイグレーション）は直接接続
      DATABASE_URL: postgres://fitlog:fitlog@localhost:6432/fitlog
      MIGRATION_DATABASE_URL: postgres://fitlog:fitlog@localhost:5432/fitlog
      # テスト専用のダミー（本番の値ではない）
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 依存を入れる（lock どおり）
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      # Vitest は「テストが0件」だと失敗する（passWithNoTests にしない）。実行件数はログの "Tests N passed" で見る
      - name: 単体テスト
        run: npm test

      - name: 結合テスト（本物の PostgreSQL）
        run: npm run test:e2e

      # API の仕様（openapi.json）を再生成して、コミットされたものと違えば落とす。
      # 仕様が変わったのに openapi.json を直し忘れると、画面の型が古いままになる。
      - name: OpenAPI が古くなっていないか
        run: |
          npm run openapi
          git diff --exit-code -- openapi.json

      - name: ビルド
        run: npm run build

      # Lambda に載せる一式（本番の依存だけ）を作り、大きさの予算を超えていないか・実際に起動するかを確かめる。
      # 取り除いた依存のせいで起動しない、という事故を、Lambda に上げる前に見つける（課金なし）
      - name: Lambda 用の一式を作り、動くか確かめる
        run: |
          npm run package:lambda
          npm run smoke:lambda

  frontend:
    name: 画面（lint・型・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存を入れる（lock どおり）
        run: npm ci

      # 画面の型は backend/openapi.json から生成する。再生成して、コミットされたものと違えば落とす。
      - name: 生成した型が古くなっていないか
        run: |
          npm run api:generate
          git diff --exit-code -- lib/api/generated.ts

      - name: lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      # Vitest は「テストが0件」だと失敗する。実行件数はログの "Tests N passed" で見る
      - name: 部品テスト
        run: npm test

      - name: ビルド（静的書き出し）
        run: npm run build

      - name: out/index.html ができているか
        run: test -f out/index.html

  infra:
    name: インフラ（fmt・validate・Trivy）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # wrapper を切る: 付けると terraform の出力が加工され、あとで読みにくい
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: 書式（fmt）
        run: terraform fmt -check -recursive

      # AWS の資格情報は使わない（backend なしで、構文と参照だけを検査する）
      - name: 初期化（プロバイダーの取得。ロックファイルのハッシュを検査）
        run: terraform init -backend=false -input=false

      - name: 検証（validate）
        run: terraform validate

      # Terraform のセキュリティ検査。版とダイジェストを固定した公式イメージ（v0.75.0）。
      # 理由つきで受け入れた指摘は infra/.trivyignore.yaml（期限を過ぎると、また指摘に出る）
      - name: セキュリティ検査（Trivy）
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa             config --skip-dirs /work/.terraform --skip-version-check --ignorefile /work/.trivyignore.yaml             --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 /work
