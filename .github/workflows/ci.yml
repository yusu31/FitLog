name: CI

# push と PR のたびに自動で走る。ここに書いた検査が全部緑になるまでマージしない運用にする。
# バックエンドのジョブ（lint・型チェック・テスト・ビルド）は 02-1 ① で追加した。画面のジョブも 02-1 ② で足した。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: 秘密情報の検査（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する（履歴ぜんぶ）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 秘密情報が含まれていないか検査する
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: バックエンド（lint・型・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # 結合テスト用の本物の PostgreSQL（本番は Neon。バージョンはローカルの docker-compose.yml と同じ）
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitlog
          POSTGRES_PASSWORD: fitlog
          POSTGRES_DB: fitlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitlog -d fitlog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # 本番の Neon の -pooler（PgBouncer のトランザクションモード）と同じ制約で結合テストをする窓口。
      # 設定はローカルの docker-compose.yml と同じ。postgres（上のサービス名）につなぐ
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_USER: fitlog
          DB_PASSWORD: fitlog
          DB_NAME: fitlog
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "1"
          MAX_CLIENT_CONN: "50"
        ports:
          - 6432:5432
    env:
      # アプリ・結合テストは PgBouncer 経由。表の作成（マイグレーション）は直接接続
      DATABASE_URL: postgres://fitlog:fitlog@localhost:6432/fitlog
      MIGRATION_DATABASE_URL: postgres://fitlog:fitlog@localhost:5432/fitlog
      # テスト専用のダミー（本番の値ではない）
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 依存を入れる（lock どおり）
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      # Vitest は「テストが0件」だと失敗する（passWithNoTests にしない）。実行件数はログの "Tests N passed" で見る
      - name: 単体テスト
        run: npm test

      - name: 結合テスト（本物の PostgreSQL）
        run: npm run test:e2e

      # API の仕様（openapi.json）を再生成して、コミットされたものと違えば落とす。
      # 仕様が変わったのに openapi.json を直し忘れると、画面の型が古いままになる。
      - name: OpenAPI が古くなっていないか
        run: |
          npm run openapi
          git diff --exit-code -- openapi.json

      - name: ビルド
        run: npm run build

  frontend:
    name: 画面（lint・型・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存を入れる（lock どおり）
        run: npm ci

      # 画面の型は backend/openapi.json から生成する。再生成して、コミットされたものと違えば落とす。
      - name: 生成した型が古くなっていないか
        run: |
          npm run api:generate
          git diff --exit-code -- lib/api/generated.ts

      - name: lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      # Vitest は「テストが0件」だと失敗する。実行件数はログの "Tests N passed" で見る
      - name: 部品テスト
        run: npm test

      - name: ビルド（静的書き出し）
        run: npm run build

      - name: out/index.html ができているか
        run: test -f out/index.html
