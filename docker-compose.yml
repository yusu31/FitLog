# ローカル開発とテスト用の PostgreSQL。本番は Neon（docs/infrastructure.md）。
# 5432・5433 は他のプロジェクトが使うことがあるので、FitLog は 5434 を使う。
services:
  db:
    # ダイジェスト（中身の指紋）で固定。CI（.github/workflows/ci.yml）と同じもの。更新は Dependabot が PR を出す
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_USER: fitlog
      POSTGRES_PASSWORD: fitlog
      POSTGRES_DB: fitlog
    ports:
      - "5434:5432"
    volumes:
      - fitlog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog -d fitlog"]
      interval: 2s
      timeout: 3s
      retries: 20


  # 本番の Neon の -pooler（PgBouncer のトランザクションモード）と同じ制約で結合テストをするための窓口。
  # トランザクションモードでは SET・セッション単位のロック・名前つきの PREPARE が使えない（docs/infrastructure.md 5.2章）。
  # アプリと結合テストは、こちらのポート（6434）につなぐ。マイグレーションは直接（5434）。
  # 1本の接続を複数の接続で使い回す（default_pool_size=1）ので、「窓口を通っている」ことをテストで確かめられる。
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    environment:
      DB_HOST: db
      DB_USER: fitlog
      DB_PASSWORD: fitlog
      DB_NAME: fitlog
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "1"
      MAX_CLIENT_CONN: "50"
    ports:
      - "6434:5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fitlog-db:
