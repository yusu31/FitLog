<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitLog 今日</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=M+PLUS+Rounded+1c:wght@800&family=Nunito:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-[#F3E8D3] font-sans text-ink antialiased" data-tab="today">
<main class="mx-auto min-h-dvh max-w-[430px] bg-bg pb-28">

  <header class="flex items-end justify-between px-5 pt-7">
    <div>
      <p id="date" class="text-sm font-bold text-mute"></p>
      <h1 class="text-[32px] leading-tight font-black">今日</h1>
    </div>
    <a href="friends.html" class="press mb-1 flex items-center gap-1.5 rounded-full bg-card px-3 py-1.5 text-xs font-bold text-mute slab">
      <span class="size-2 rounded-full bg-sky"></span>朝トレ部 <span class="font-num text-ink">5</span>人
    </a>
  </header>

  <!-- ① 今週の7マス（連続日数は持たない。記録のない日は淡い「休」で、欠けに見せない） -->
  <section class="mx-4 mt-5 rounded-card bg-card p-4 slab" aria-labelledby="week-title">
    <div class="flex items-baseline justify-between">
      <h2 id="week-title" class="font-black">今週</h2>
      <p class="text-xs font-bold text-mute">動いた日 <span id="week-count" class="font-num text-base text-ink"></span><span class="font-num">/7</span></p>
    </div>
    <ol id="week" class="mt-4 grid grid-cols-7 gap-2"></ol>
    <p class="mt-3 text-[11px] font-bold text-mute">月曜にまっさらから始まります。</p>
  </section>

  <!-- ② 責めない一言（前日の記録・空き日数で出し分け） -->
  <div class="relative mx-4 mt-5">
    <span class="absolute -top-2 left-8 size-4 rotate-45 rounded-[3px] bg-card"></span>
    <p id="hint" class="relative rounded-btn bg-card px-4 py-3.5 text-[15px] leading-relaxed font-bold slab" aria-live="polite"></p>
  </div>

  <!-- ③ 前回の1行 ＋ ④ 大きな「はじめる」 -->
  <section class="mx-4 mt-5" aria-labelledby="next-title">
    <div class="flex items-baseline justify-between px-1">
      <h2 id="next-title" class="text-xl font-black">脚の日</h2>
      <p class="text-xs font-bold text-mute"><span class="font-num">4</span>種目・約<span class="font-num">45</span>分</p>
    </div>
    <p class="mt-1 px-1 text-sm font-bold text-mute">前回 10/20（火）<span class="font-num text-ink">4,950kg</span> の数字から始めます</p>
    <a id="start" href="record-strength.html" class="puff mt-3 flex h-[72px] items-center justify-center gap-2 rounded-btn text-2xl font-black"></a>
    <div class="mt-4 flex items-center justify-center gap-5 text-sm font-bold text-mute">
      <button type="button" id="run" class="press underline decoration-2 underline-offset-4">ランを記録</button>
      <button type="button" id="rest" class="press underline decoration-2 underline-offset-4"></button>
    </div>
  </section>

</main>
<script>
  const { prefs, setPref, scenarios, week, renderWeek } = FitLog;
  const $ = (id) => document.getElementById(id);
  const just = new URLSearchParams(location.search).has("just");
  // 休むボタンを「なし」にしたら、休みの状態は持ち越さない
  if (prefs.rest === "off" && prefs.today === "rest") setPref("today", "none");

  const s = scenarios[prefs.gap];
  const hints = {
    none: {
      yday: "昨日は背中の日。今日は休むのもいい選択です。やるなら、脚はまっさら。",
      d3: "2日休んで、からだは回復ずみ。1セットだけでも始めてみる？",
      d8: `前回は ${s.last}。数字は前回のまま入っているので、1セットからで十分。`,
    },
    done: {
      yday: "今日もできた。あとはよく食べて、よく寝よう。",
      d3: "おかえり。3日ぶりの1回。休んだぶん、からだは元気でした。",
      d8: "おかえり。8日ぶりの1回。戻ってきたことがいちばん大きい。",
    },
    rest: { all: "いい休みを。休むのもトレーニングのうち。明日、脚の日が待っています。" },
  };

  function render(animateToday = false) {
    $("date").textContent = FitLog.TODAY_LABEL;
    renderWeek($("week"), { animateToday });
    $("week-count").textContent = week().filter((d) => d.state === "done").length;

    const t = prefs.today;
    $("hint").textContent = t === "rest" ? hints.rest.all : hints[t][prefs.gap];

    const start = $("start");
    if (t === "none") {
      start.className = "puff mt-3 flex h-[72px] items-center justify-center gap-2 rounded-btn bg-next text-2xl font-black text-card [--puff-c:var(--color-next-deep)]";
      start.innerHTML = `はじめる <svg viewBox="0 0 24 24" class="size-7" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>`;
    } else {
      // 記録後・休むと決めた後は、主役を降りた控えめなボタンにする
      start.className = "puff mt-3 flex h-14 items-center justify-center gap-2 rounded-btn border-2 border-line bg-card text-lg font-black text-ink";
      start.textContent = t === "done" ? "もう1回記録する" : "やっぱりやる";
    }

    const rest = $("rest");
    rest.hidden = prefs.rest === "off" || t === "done";
    rest.textContent = t === "rest" ? "休みを取り消す" : "今日は休む";
  }

  $("rest").addEventListener("click", () => {
    if (prefs.today === "rest") {
      setPref("today", "none");
      render();
      return;
    }
    setPref("today", "rest");
    render(true);
    toast("仲間の足跡に「おやすみ」を出しました", "sky");
  });
  $("run").addEventListener("click", () => toast("ランの記録（距離・時間／GPX）はプロトタイプでは省略"));

  render(just);
  if (just) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
