<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitLog 筋トレの記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=M+PLUS+Rounded+1c:wght@800&family=Nunito:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-[#F3E8D3] font-sans text-ink antialiased">
<main class="mx-auto min-h-dvh max-w-[430px] bg-bg pb-16">

  <!-- 上の帯: 戻る／メニュー名と経過時間／終了 -->
  <header class="sticky top-0 z-20 flex items-center justify-between gap-2 bg-bg/90 px-4 pt-4 pb-3 backdrop-blur">
    <a href="today.html" class="press grid size-11 place-items-center rounded-full bg-card slab" aria-label="今日へ戻る">
      <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
    </a>
    <div class="text-center">
      <p class="text-xs font-bold text-mute">脚の日</p>
      <p id="elapsed" class="font-num text-xl font-extrabold">04:10</p>
    </div>
    <button type="button" id="finish" class="press rounded-full bg-card px-4 py-2.5 text-sm font-bold slab">終了</button>
  </header>

  <!-- ゴーストとのレース（同じセット数の時点での合計を比べる） -->
  <section class="mx-4 mt-1 rounded-card bg-card p-4 slab" aria-label="前回の自分との対戦">
    <div class="flex items-baseline justify-between">
      <p class="text-xs font-bold text-mute">相手は<span class="text-ink">前回の自分</span>（10/20）</p>
      <p id="lead" class="font-num text-lg font-extrabold"></p>
    </div>
    <div class="mt-3 space-y-2.5">
      <div class="flex items-center gap-2">
        <span class="w-12 shrink-0 text-xs font-bold">あなた</span>
        <div class="h-4 flex-1 rounded-full bg-raised p-[3px]"><div id="bar-you" class="h-full rounded-full transition-[width] duration-700 ease-[var(--spring)]"></div></div>
        <span id="vol-you" class="font-num w-16 shrink-0 text-right text-sm font-extrabold"></span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-12 shrink-0 text-xs font-bold text-mute">前回</span>
        <div class="h-4 flex-1 rounded-full bg-raised p-[3px]"><div id="bar-ghost" class="h-full rounded-full bg-ink/20 transition-[width] duration-700 ease-[var(--spring)]"></div></div>
        <span id="vol-ghost" class="font-num w-16 shrink-0 text-right text-sm font-extrabold text-mute"></span>
      </div>
    </div>
  </section>

  <!-- いまの種目 -->
  <section class="mx-4 mt-4 rounded-card bg-card p-4 slab" aria-labelledby="ex-name">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="text-xs font-bold text-mute">種目 <span id="ex-index" class="font-num"></span></p>
        <h1 id="ex-name" class="truncate text-2xl font-black"></h1>
      </div>
      <button type="button" id="video" class="press flex shrink-0 items-center gap-1.5 rounded-full bg-raised px-3 py-2 text-xs font-bold">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="6.5" width="12.5" height="11" rx="3"/><path d="m15.5 10.5 5-3v9l-5-3z"/></svg>
        <span><span class="font-num">2</span>秒撮る</span>
      </button>
    </div>

    <!-- セットの並び（前回と今回） -->
    <ol id="sets" class="mt-3 space-y-1.5"></ol>

    <!-- いまのセット: 前回の値が最初から入っている。押すのは「できた」だけ -->
    <div class="mt-4 rounded-tile bg-raised px-4 pt-3 pb-4 text-center">
      <p class="text-xs font-bold text-mute">セット <span id="set-no" class="font-num"></span></p>
      <p class="font-num mt-1 text-[44px] leading-none font-extrabold"><span id="w"></span><span class="text-xl text-mute">kg</span> <span class="text-2xl text-mute">×</span> <span id="r"></span><span class="text-xl text-mute">回</span></p>
      <p id="vs-hint" class="mt-2 text-xs font-bold text-mute"></p>
      <div id="steppers" class="mt-3 hidden grid-cols-2 gap-3">
        <div class="grid grid-cols-2 gap-1.5">
          <button type="button" data-step="w:-1" class="press h-11 rounded-tile bg-card text-2xl font-black" aria-label="重さを減らす">−</button>
          <button type="button" data-step="w:1" class="press h-11 rounded-tile bg-card text-2xl font-black" aria-label="重さを増やす">＋</button>
          <p class="col-span-2 text-[11px] font-bold text-mute">重さ</p>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button type="button" data-step="r:-1" class="press h-11 rounded-tile bg-card text-2xl font-black" aria-label="回数を減らす">−</button>
          <button type="button" data-step="r:1" class="press h-11 rounded-tile bg-card text-2xl font-black" aria-label="回数を増やす">＋</button>
          <p class="col-span-2 text-[11px] font-bold text-mute">回数</p>
        </div>
      </div>
    </div>

    <button type="button" id="complete" class="puff mt-4 flex h-[72px] w-full items-center justify-center gap-2 rounded-btn bg-next text-2xl font-black text-card [--puff-c:var(--color-next-deep)]">
      <svg viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>できた
    </button>
    <button type="button" id="edit" class="press mx-auto mt-3 block text-sm font-bold text-mute underline decoration-2 underline-offset-4" aria-expanded="false">数字を変える</button>
  </section>

  <!-- このあとの種目 -->
  <section class="mx-4 mt-4 rounded-card bg-card p-4 slab" aria-labelledby="next-title">
    <h2 id="next-title" class="text-sm font-black text-mute">このあと</h2>
    <ul id="upcoming" class="mt-1 divide-y-2 divide-line/60"></ul>
  </section>
</main>

<!-- 終了したときのまとめ -->
<div id="summary" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="sum-title">
  <div class="absolute inset-0 bg-ink/40"></div>
  <div class="pop-in absolute inset-x-4 top-1/2 mx-auto max-w-[398px] -translate-y-1/2 rounded-card bg-card p-6 text-center">
    <p id="sum-lead" class="text-sm font-bold text-mute">おつかれさま</p>
    <h2 id="sum-title" class="mt-1 text-2xl font-black"></h2>
    <dl class="mt-5 grid grid-cols-2 gap-3 text-left">
      <div class="rounded-tile bg-raised p-3"><dt class="text-xs font-bold text-mute">合計の重さ</dt><dd id="sum-vol" class="font-num text-2xl font-extrabold"></dd></div>
      <div class="rounded-tile bg-raised p-3"><dt class="text-xs font-bold text-mute">前回との差</dt><dd id="sum-diff" class="font-num text-2xl font-extrabold"></dd></div>
    </dl>
    <a id="sum-home" href="today.html?just=1" class="puff mt-5 flex h-14 items-center justify-center rounded-btn bg-next text-lg font-black text-card [--puff-c:var(--color-next-deep)]">今日へ戻る</a>
    <button type="button" id="sum-close" class="press mt-3 w-full py-2 text-sm font-bold text-mute">記録を続ける</button>
  </div>
</div>

<script>
  const { prefs, setPref, scenarios } = FitLog;
  // 前回の自分は「今日」画面の数字（合計 4,950kg）と一致させている。best は種目ごとの自己ベスト（1セットの重さ）
  const plan = [
    { name: "スクワット", sets: 3, w: 60, r: 8, step: 2.5, best: 57.5, ghost: [[57.5, 8], [57.5, 8], [57.5, 8]] },
    { name: "ルーマニアンデッドリフト", sets: 3, w: 70, r: 10, step: 2.5, best: 72.5, ghost: [[70, 9], [70, 9], [70, 9]] },
    { name: "ブルガリアンスクワット", sets: 3, w: 16, r: 10, step: 2, best: 18, ghost: [[16, 10], [16, 10], [16, 10]] },
    { name: "レッグエクステンション", sets: 3, w: 40, r: 12, step: 5, best: 45, ghost: [[40, 10], [40, 10], [40, 10]] },
  ];
  const state = { cur: 0, w: 60, r: 8, done: plan.map(() => []), best: false };
  state.done[0].push([60, 8]); // 1セット目は済んだ状態から始める
  state.best = true;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("ja-JP");
  const kg = (w) => (Number.isInteger(w) ? w : w.toFixed(1));
  const vol = ([w, r]) => w * r;
  const youTotal = () => state.done.flat().reduce((a, s) => a + vol(s), 0);
  const ghostAtSamePoint = () => state.done.reduce((a, sets, i) => a + plan[i].ghost.slice(0, sets.length).reduce((b, s) => b + vol(s), 0), 0);
  const ghostFull = () => plan.reduce((a, p) => a + p.ghost.reduce((b, s) => b + vol(s), 0), 0);
  const result = (mine, theirs) => (vol(mine) > vol(theirs) ? "win" : vol(mine) === vol(theirs) ? "draw" : "lose");
  // 負けは赤にしない（ぶどう色）
  const chip = {
    win: '<span class="rounded-full bg-win px-2 py-0.5 text-xs font-black text-card">勝ち</span>',
    draw: '<span class="rounded-full bg-raised px-2 py-0.5 text-xs font-bold text-mute">引分</span>',
    lose: '<span class="rounded-full bg-lose/15 px-2 py-0.5 text-xs font-bold text-lose">あと少し</span>',
  };

  function render() {
    const p = plan[state.cur];
    const done = state.done[state.cur];

    // レース
    const you = youTotal(), gh = ghostAtSamePoint(), diff = you - gh;
    const scale = Math.max(ghostFull(), 5460);
    $("bar-you").style.width = `${Math.max(4, (you / scale) * 100)}%`;
    $("bar-you").className = `h-full rounded-full transition-[width] duration-700 ease-[var(--spring)] ${diff >= 0 ? "bg-win" : "bg-lose"}`;
    $("bar-ghost").style.width = `${Math.max(4, (gh / scale) * 100)}%`;
    $("vol-you").textContent = `${fmt(you)}kg`;
    $("vol-ghost").textContent = `${fmt(gh)}kg`;
    $("lead").innerHTML = diff > 0 ? `<span class="text-win">+${fmt(diff)}kg リード</span>`
      : diff < 0 ? `<span class="text-lose">あと${fmt(-diff)}kg</span>` : '<span class="text-mute">並んでいる</span>';

    // 種目とセット
    $("ex-index").textContent = `${state.cur + 1} / ${plan.length}`;
    $("ex-name").textContent = p.name;
    $("sets").innerHTML = Array.from({ length: p.sets }, (_, i) => {
      const g = p.ghost[i], mine = done[i], isCur = i === done.length;
      const now = mine ? `${kg(mine[0])} × ${mine[1]}` : isCur ? `${kg(state.w)} × ${state.r}` : "—";
      const res = mine ? chip[result(mine, g)] : isCur ? '<span class="text-xs font-black text-next">いま</span>' : "";
      return `<li class="grid grid-cols-[2rem_1fr_1fr_4.5rem] items-center rounded-tile px-2 py-2 text-sm ${isCur ? "bg-next/10" : ""}">
        <span class="font-num font-extrabold text-mute">${i + 1}</span>
        <span class="font-num font-extrabold text-mute">前回 ${kg(g[0])} × ${g[1]}</span>
        <span class="font-num font-extrabold ${mine ? "" : isCur ? "text-ink" : "text-mute"}">${now}</span>
        <span class="text-right">${res}</span></li>`;
    }).join("");

    // いまのセット（最後の種目の全セットが済んだら、前回の値は読まない）
    $("w").textContent = kg(state.w);
    $("r").textContent = state.r;
    if (done.length === p.sets) {
      $("set-no").textContent = "全セット完了";
      $("vs-hint").textContent = "おつかれさま";
    } else {
      $("set-no").textContent = `${done.length + 1} / ${p.sets}`;
      const g = p.ghost[done.length];
      const res = result([state.w, state.r], g);
      $("vs-hint").innerHTML = res === "win" ? `このままなら前回に<span class="text-win">勝ち</span>`
        : res === "draw" ? "このままなら前回と引き分け"
        : `前回は ${kg(g[0])}kg × ${g[1]}。<span class="text-lose">あと${fmt(vol(g) - vol([state.w, state.r]))}kg分</span>`;
    }

    // このあと
    $("upcoming").innerHTML = plan.slice(state.cur + 1).map((q) => `
      <li class="flex items-center justify-between gap-3 py-2.5">
        <span class="truncate font-bold">${q.name}</span>
        <span class="font-num shrink-0 text-sm font-extrabold text-mute">${kg(q.w)}kg × ${q.r} × ${q.sets}</span>
      </li>`).join("") || '<li class="py-2.5 text-sm font-bold text-mute">これで最後の種目</li>';
  }

  // 経過時間
  let elapsed = 250;
  setInterval(() => {
    elapsed++;
    $("elapsed").textContent = `${String(Math.floor(elapsed / 60)).padStart(2, "0")}:${String(elapsed % 60).padStart(2, "0")}`;
  }, 1000);

  // 数字を変える（ふだんは隠しておき、押したときだけ増減ボタンを出す）
  $("edit").addEventListener("click", (e) => {
    const open = $("steppers").classList.toggle("hidden") === false;
    $("steppers").classList.toggle("grid", open);
    e.currentTarget.setAttribute("aria-expanded", open);
    e.currentTarget.textContent = open ? "閉じる" : "数字を変える";
  });
  document.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
    const [key, dir] = b.dataset.step.split(":");
    if (key === "w") state.w = Math.max(0, state.w + Number(dir) * plan[state.cur].step);
    else state.r = Math.max(1, state.r + Number(dir));
    render();
  }));

  $("complete").addEventListener("click", () => {
    const p = plan[state.cur], done = state.done[state.cur];
    const set = [state.w, state.r];
    const res = result(set, p.ghost[done.length]);
    done.push(set);
    if (set[0] > p.best) state.best = true;
    const msg = { win: ["前回に勝ち！", "win"], draw: ["引き分け。次で抜こう", "ink"], lose: ["あと少し。次のセットで", "ink"] }[res];
    toast(msg[0], msg[1]);
    if (done.length === p.sets) {
      if (state.cur === plan.length - 1) { render(); return finish(); }
      state.cur++;
      state.w = plan[state.cur].w;
      state.r = plan[state.cur].r;
    }
    render();
  });

  $("video").addEventListener("click", () => toast("ここから2秒だけ撮る（プロトタイプでは撮らない）"));

  // 終了: 0.8秒の祝福 → まとめ。2日以上空いた後の最初の記録は「おかえり」
  async function finish() {
    const total = youTotal(), diff = total - ghostAtSamePoint();
    const gap = scenarios[prefs.gap].gap;
    const back = gap >= 2;
    const sub = back
      ? (diff > 0 ? `${gap}日ぶりの1回。休み明けで前回超え` : `${gap}日ぶりの1回`)
      : (diff > 0 ? `前回より +${fmt(diff)}kg` : "今日の1回を記録しました");
    setPref("today", "done");
    await celebrate({ title: back ? "おかえり" : "できた！", sub, badge: state.best ? "ベスト" : "", tone: back ? "sky" : "win" });

    let win = 0, lose = 0;
    state.done.forEach((sets, i) => sets.forEach((s, j) => {
      const r = result(s, plan[i].ghost[j]);
      if (r === "win") win++;
      if (r === "lose") lose++;
    }));
    $("sum-lead").textContent = back ? `おかえり。${gap}日ぶりの1回` : "おつかれさま";
    $("sum-title").innerHTML = `前回の自分に <span class="font-num text-win">${win}</span>勝 <span class="font-num">${lose}</span>敗`;
    $("sum-vol").textContent = `${fmt(total)}kg`;
    $("sum-diff").innerHTML = diff >= 0 ? `<span class="text-win">+${fmt(diff)}</span>` : `<span class="text-lose">${fmt(diff)}</span>`;
    $("summary").classList.remove("hidden");
  }
  $("finish").addEventListener("click", finish);
  $("sum-close").addEventListener("click", () => $("summary").classList.add("hidden"));

  render();
</script>
</body>
</html>
