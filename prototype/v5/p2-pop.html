<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitLog v5 P2 ポップ・イラスト型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
<style>
:root{--ink:#1A1A1A;--pink:#FF4F8B;--teal:#1FB5A0;--yellow:#FFD23F;--purple:#6B4BD8;--dotP:#F7B7CF;--dotT:#9BE0D3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;color:var(--ink);background-color:#fff;
 background-image:radial-gradient(var(--dotP) 2.2px,transparent 2.7px),radial-gradient(var(--dotT) 1.6px,transparent 2.1px);
 background-size:16px 16px,16px 16px;background-position:0 0,8px 8px;-webkit-tap-highlight-color:transparent}
h1,h2,.pop{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.app{position:relative;width:390px;max-width:100%;height:844px;max-height:100dvh;margin:0 auto;overflow:hidden;background:rgba(255,255,255,.0)}
@media (min-width:500px){.app{margin-top:max(0px,calc((100dvh - 844px)/2));border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);background:#fff;
 background-image:radial-gradient(var(--dotP) 2.2px,transparent 2.7px),radial-gradient(var(--dotT) 1.6px,transparent 2.1px);background-size:16px 16px;background-position:0 0,8px 8px}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:0 14px 16px}
.stk{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:6px 12px;min-height:44px;font-weight:900;line-height:1.1}
.stk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;gap:8px;flex:none}
.top .pop{font-size:15px}
.logo{font-family:"Mochiy Pop One";font-size:20px;background:var(--yellow);transform:rotate(-3deg);padding:4px 14px}
.nav b{font-family:"Mochiy Pop One";font-weight:400;color:var(--pink);font-size:16px}
.week{display:flex;justify-content:space-between;gap:4px;flex:none;padding:2px 2px 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px}
.day i{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-style:normal;font-family:"Mochiy Pop One";font-size:15px;box-shadow:0 3px 0 var(--ink)}
.day small{font-size:11px;font-weight:900;height:14px}
.day.done i{background:var(--yellow)}
.day.rest i{background:var(--purple);color:#fff}
.day.now i{background:var(--pink);color:#fff;transform:translateY(-2px) scale(1.1)}
.day.next i{border-style:dashed;box-shadow:none;color:#999}
#map{flex:1;min-height:0;width:100%;overflow:visible}
.cta{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 0}
.gear{position:relative;width:var(--s,112px);height:calc(var(--s,112px)*1.04);flex:none}
.gear svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gear .face{transform:translateY(0);transition:transform .08s}
.gear:active .face{transform:translateY(4px)}
.gear span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Mochiy Pop One";font-size:var(--fs,22px);padding-bottom:4px;text-align:center;line-height:1.1;pointer-events:none}
.gear.spin:hover .face{animation:wob .6s}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}}
.bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
/* record */
.rec{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.tag{font-family:"Mochiy Pop One";font-weight:400;font-size:20px;background:var(--teal);color:#fff;transform:rotate(-2deg);text-shadow:none;padding:6px 16px}
.card{position:relative;width:100%;background:var(--yellow);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;
 background-image:radial-gradient(#F2B800 2px,transparent 2.6px);background-size:12px 12px}
.ghost{background:#fff;font-size:15px;transform:rotate(2deg)}
.ghost b{font-family:"Mochiy Pop One";font-weight:400;font-size:17px}
.bignum{font-family:"Mochiy Pop One";font-size:50px;white-space:nowrap;padding-top:26px!important;padding-bottom:26px!important;line-height:1;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 10px;width:100%;box-shadow:0 4px 0 var(--ink)}
.bignum small{font-size:24px}
.adj{display:flex;gap:10px;width:100%;justify-content:space-between}
.adjg{flex:1;display:flex;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--ink);border-radius:40px;padding:4px;box-shadow:0 4px 0 var(--ink)}
.adjg span{font-size:13px;font-weight:900;text-align:center;line-height:1.1}
.pm{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:"Mochiy Pop One";font-size:26px;box-shadow:0 3px 0 var(--ink);flex:none}
.pm.m{background:var(--teal);color:#fff}.pm.p{background:var(--pink);color:#fff}
.pm:active{transform:translateY(3px);box-shadow:none}
.burst{position:relative;height:72px;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-family:"Mochiy Pop One";font-size:44px;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-6deg);opacity:0;line-height:1.1}
.burst.go{animation:burst .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes burst{0%{opacity:0;transform:scale(.2) rotate(-20deg)}30%{opacity:1;transform:scale(1.25) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots i.on{background:var(--yellow)}.dots i.cur{background:var(--pink)}
.rec .gear{margin-top:auto}.rec .card{gap:18px}
/* rest */
.restwrap{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:4px}
.restwrap svg{width:100%;height:auto}
.say{font-size:20px;text-align:center;font-family:"Mochiy Pop One";font-weight:400;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:12px 16px;transform:rotate(-1.5deg)}
.say small{display:block;font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;margin-top:4px}
.row2{display:flex;gap:12px;margin-top:auto;padding-top:10px;flex-wrap:wrap;justify-content:center}
/* friends */
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:8px 0 10px}
.fc{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.fc:nth-child(1){transform:rotate(-1.5deg)}.fc:nth-child(2){transform:rotate(1.5deg)}.fc:nth-child(3){transform:rotate(1deg)}.fc:nth-child(4){transform:rotate(-1deg)}
.fc .nm{font-family:"Mochiy Pop One";font-weight:400;font-size:17px}
.fc .dd{font-size:13px;font-weight:900}
.fc .dd b{font-family:"Mochiy Pop One";font-weight:400;font-size:20px;color:var(--pink)}
.mini{display:flex;gap:3px}.mini i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#fff}.mini i.on{background:var(--yellow)}.mini i.r{background:var(--purple)}
.bub{position:relative;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;font-size:12px;padding:5px 8px;text-align:center;line-height:1.3;width:100%}
.bub:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-7px;width:12px;height:12px;background:var(--yellow);border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg) translate(3px,3px)}
.stamps{display:flex;gap:4px}
.stamps .gear{--s:44px}
.cnt{position:absolute;right:-4px;top:-8px;background:#fff;border:2px solid var(--ink);border-radius:10px;font-size:11px;padding:0 5px;min-width:20px;text-align:center;font-weight:900}
.stwrap{position:relative}
.stwrap.hit .face{animation:wob .4s}
.stwrap.hit .cnt{background:var(--yellow)}
/* me */
.bodies{display:flex;gap:10px;justify-content:center;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:14px 8px 10px;margin-top:6px;position:relative}
.bodies figure{margin:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bodies svg{width:100%;max-width:150px;height:auto;overflow:visible}
.bodies figcaption{background:var(--teal);color:#fff;font-family:"Mochiy Pop One";font-size:14px;border:3px solid var(--ink);border-radius:10px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.legend .stk{min-height:34px;font-size:12px;padding:3px 10px}
.legend i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pi{display:flex;align-items:center;justify-content:space-between;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 var(--ink);min-height:44px;background:#fff}
.pi b{font-family:"Mochiy Pop One";font-weight:400;font-size:20px}
.h2{font-size:22px;margin:10px 0 4px;display:inline-block;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:4px 16px;transform:rotate(-2deg);align-self:flex-start}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) rotate(-3deg);z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <pattern id="dotsG" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EDEDED"/><circle cx="4" cy="4" r="1.6" fill="#BDBDBD"/></pattern>
  <pattern id="dotsW" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#fff" fill-opacity=".45"/></pattern>
 </defs>
</svg>
<main class="app">

<!-- ====== today ====== -->
<section id="v-today" class="view" hidden>
 <header class="top">
  <a href="#friends" class="stk nav">なかま <b>4</b></a>
  <div class="logo stk" aria-label="FitLog">FitLog</div>
  <a href="#me" class="stk nav">ずかん <b id="zk">4/6</b></a>
 </header>
 <div class="week" id="week"></div>
 <svg id="map" viewBox="0 0 390 560" role="img" aria-label="からだマップ"></svg>
 <div class="cta">
  <button class="gear" id="go" data-fill="#FF4F8B" style="--s:116px;--fs:24px"><span id="goTxt">出発！</span></button>
  <button class="stk" id="restBtn" style="background:var(--purple);color:#fff">今日は休む</button>
 </div>
</section>

<!-- ====== record ====== -->
<section id="v-record" class="view" hidden>
 <header class="top">
  <a href="#today" class="stk nav">もどる</a>
  <div class="dots" id="recDots" aria-label="進み具合"></div>
 </header>
 <div class="rec">
  <div class="stk tag" id="exName">スクワット</div>
  <div class="card">
   <div class="stk ghost">前回 <b id="ghost">60kg × 10回</b> × 3セット</div>
   <div class="bignum pop" id="recNum">60<small>kg</small> × 10<small>回</small></div>
   <div class="adj">
    <div class="adjg"><button class="pm m" id="wm" aria-label="重さを減らす">−</button><span>重さ<br>5kg</span><button class="pm p" id="wp" aria-label="重さを増やす">+</button></div>
    <div class="adjg"><button class="pm m" id="rm" aria-label="回数を減らす">−</button><span>回数<br>1回</span><button class="pm p" id="rp" aria-label="回数を増やす">+</button></div>
   </div>
  </div>
  <div class="burst" id="burst" aria-live="polite"></div>
  <button class="gear" id="doneBtn" data-fill="#1FB5A0" style="--s:132px;--fs:26px"><span id="doneTxt">できた！</span></button>
 </div>
</section>

<!-- ====== rest ====== -->
<section id="v-rest" class="view" hidden>
 <header class="top"><a href="#today" class="stk nav">もどる</a><div class="stk" style="background:var(--purple);color:#fff">おやすみ</div></header>
 <div class="restwrap">
  <svg viewBox="0 0 360 330" role="img" aria-label="ハンモックで寝ている人" id="restSvg"></svg>
  <div class="say">今日は おやすみ<small>休んだ日も ちゃんと 1マス。からだは 休んでる間に つよくなる</small></div>
  <div class="row2">
   <button class="stk" id="undoRest">やっぱりやる</button>
   <a class="stk" href="#today" style="background:var(--yellow)">ホームへ</a>
  </div>
 </div>
</section>

<!-- ====== friends ====== -->
<section id="v-friends" class="view" hidden>
 <header class="top"><a href="#today" class="stk nav">もどる</a><div class="stk" style="background:var(--yellow)">なかま 5にん</div></header>
 <h2 class="h2">けいじばん</h2>
 <div class="board" id="board"></div>
 <p style="font-size:12px;text-align:center;margin:0">スタンプは 1人 1こずつ おせるよ</p>
</section>

<!-- ====== me ====== -->
<section id="v-me" class="view" hidden>
 <header class="top"><a href="#today" class="stk nav">もどる</a><div class="stk" style="background:var(--yellow)">ずかん</div></header>
 <h2 class="h2">からだずかん</h2>
 <div class="bodies">
  <figure><svg id="bodyF" viewBox="0 0 120 240" aria-label="前から見た人体"></svg><figcaption>まえ</figcaption></figure>
  <figure><svg id="bodyB" viewBox="0 0 120 240" aria-label="後ろから見た人体"></svg><figcaption>うしろ</figcaption></figure>
 </div>
 <div class="legend">
  <span class="stk"><i style="background:#EDEDED"></i>まだ</span>
  <span class="stk"><i style="background:var(--teal)"></i>1〜2セット</span>
  <span class="stk"><i style="background:var(--yellow)"></i>3セット</span>
  <span class="stk"><i style="background:var(--pink)"></i>4〜</span>
 </div>
 <div class="plist" id="plist"></div>
</section>

</main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const SVGNS='http://www.w3.org/2000/svg';
const INK='#1A1A1A', PINK='#FF4F8B', TEAL='#1FB5A0', YEL='#FFD23F', PUR='#6B4BD8';

/* ---------- state ---------- */
const BASE={chest:3,shoulder:3,arm:4,back:3,leg:0,abs:0};
const NAMES={chest:'胸',shoulder:'肩',arm:'腕',back:'背中',leg:'脚',abs:'お腹'};
const EX=[{n:'スクワット',w:60,r:10},{n:'ルーマニアンデッドリフト',w:50,r:12},{n:'レッグプレス',w:100,r:12},{n:'カーフレイズ',w:40,r:15}];
const S={rest:false,idx:0,cur:EX.map(e=>({w:e.w,r:e.r})),logged:false,legDone:false,stamps:{}};
const sets=k=>k==='leg'&&S.legDone?12:BASE[k];
const lvl=n=>n<=0?0:n<=2?1:n===3?2:3;
const LCOL=['url(#dotsG)',TEAL,YEL,PINK];

/* ---------- ギザギザのバッジ ---------- */
function gearPath(cx,cy,R,r,n){let d='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,rad=i%2?r:R;d+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+' '+(cy+rad*Math.sin(a)).toFixed(1)}return d+'Z'}
function gearSVG(fill,teeth=14){
  return `<svg viewBox="0 0 100 104" aria-hidden="true"><path d="${gearPath(50,53,46,38,teeth)}" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><g class="face"><path d="${gearPath(50,48,46,38,teeth)}" fill="${fill}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="48" r="31" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/></g></svg>`;
}
function decorateGears(root=document){root.querySelectorAll('.gear:not([data-ok])').forEach(b=>{b.dataset.ok=1;b.insertAdjacentHTML('afterbegin',gearSVG(b.dataset.fill||PINK,+b.dataset.teeth||14))})}

/* ---------- 人体（黒い太線3px＋平らな塗り） ---------- */
function body(side){
  const L=k=>LCOL[lvl(sets(k))];
  const st=`stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;
  const r=(x,y,w,h,rx,k)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${L(k)}" ${st}/>`;
  const circ=(cx,cy,rr,k)=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${L(k)}" ${st}/>`;
  let s='';
  // 脚（前: 太もも+すね / 後ろ: おしり+太もも+ふくらはぎ）
  s+=r(44,128,15,56,8,'leg')+r(61,128,15,56,8,'leg')+r(45,188,13,44,6,'leg')+r(62,188,13,44,6,'leg');
  // 胴体の土台
  s+=`<rect x="41" y="46" width="38" height="84" rx="14" fill="#fff" ${st}/>`;
  // 腕
  s+=r(18,66,15,40,7.5,'arm')+r(18,108,14,38,7,'arm')+r(87,66,15,40,7.5,'arm')+r(88,108,14,38,7,'arm');
  if(side==='f'){
    s+=r(44,50,15,26,8,'chest')+r(61,50,15,26,8,'chest')+r(46,79,28,46,9,'abs');
    s+=`<path d="M60 80V124M47 96H73M47 110H73" stroke="${INK}" stroke-width="2" stroke-opacity=".35" fill="none"/>`;
  }else{
    s+=r(43,50,34,52,12,'back');
    s+=r(45,104,30,24,10,'leg');
  }
  // 肩
  s+=circ(35,54,11,'shoulder')+circ(85,54,11,'shoulder');
  // 首・頭
  s+=`<rect x="54" y="34" width="12" height="14" rx="4" fill="#fff" ${st}/>`;
  s+=`<circle cx="60" cy="21" r="17" fill="#fff" ${st}/>`;
  if(side==='f') s+=`<circle cx="54" cy="22" r="2.2" fill="${INK}"/><circle cx="66" cy="22" r="2.2" fill="${INK}"/><path d="M55 29Q60 33 65 29" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
  else s+=`<path d="M43 21A17 17 0 0 1 77 21Q60 14 43 21Z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  return s;
}

/* ---------- ホーム：からだマップ ---------- */
const AREAS=[
 {k:'shoulder',x:28,y:41,w:150,h:110,rot:-1.5},{k:'chest',x:212,y:29,w:150,h:120,rot:1.5},
 {k:'arm',x:22,y:204,w:130,h:120,rot:1},{k:'back',x:228,y:202,w:134,h:120,rot:-1},
 {k:'abs',x:40,y:382,w:130,h:115,rot:-1.5},{k:'leg',x:214,y:367,w:140,h:142,rot:1.5}];
const ROADS=[['shoulder','chest'],['shoulder','arm'],['chest','back'],['arm','back'],['arm','abs'],['back','leg'],['abs','leg']];
const ctr=a=>[a.x+a.w/2,a.y+a.h/2];
function renderMap(){
  const A=Object.fromEntries(AREAS.map(a=>[a.k,a]));
  let s=`<rect x="6" y="10" width="378" height="546" rx="46" fill="#000"/><rect x="6" y="6" width="378" height="546" rx="46" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
  s+=`<rect x="14" y="14" width="362" height="530" rx="38" fill="none" stroke="${TEAL}" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>`;
  for(const [a,b] of ROADS){const [x1,y1]=ctr(A[a]),[x2,y2]=ctr(A[b]);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="17" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="9" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${PINK}" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>`}
  let got=0;
  for(const a of AREAS){
    const n=sets(a.k),l=lvl(n);if(l)got++;
    const [cx,cy]=ctr(a);
    const isLeg=a.k==='leg'&&!S.legDone&&!S.rest;
    s+=`<g transform="rotate(${a.rot} ${cx} ${cy})" ${a.k==='leg'?'id="legArea" style="cursor:pointer" tabindex="0" role="button" aria-label="脚のエリアを記録する"':''}>`;
    s+=`<rect x="${a.x}" y="${a.y+6}" width="${a.w}" height="${a.h}" rx="24" fill="${INK}"/>`;
    s+=`<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="24" fill="${LCOL[l]}" stroke="${INK}" stroke-width="3"/>`;
    if(l) s+=`<rect x="${a.x+2}" y="${a.y+2}" width="${a.w-4}" height="${a.h-4}" rx="22" fill="url(#dotsW)"/>`;
    s+=`<text x="${a.x+16}" y="${a.y+38}" font-family="Mochiy Pop One" font-size="28" fill="${INK}">${NAMES[a.k]}</text>`;
    if(l){
      s+=`<path d="${gearPath(a.x+a.w-34,a.y+34,25,20,10)}" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><text x="${a.x+a.w-34}" y="${a.y+43}" text-anchor="middle" font-family="Mochiy Pop One" font-size="${n>9?19:25}" fill="${INK}">${n}</text>`;
      s+=`<g transform="translate(${a.x+14} ${a.y+a.h-34})"><rect width="${n>9?96:70}" height="26" rx="8" fill="#fff" stroke="${INK}" stroke-width="3"/><text x="${n>9?48:35}" y="19" text-anchor="middle" font-size="14" font-weight="900" fill="${INK}">${n>9?n+'セット':'今週'}</text></g>`;
    }else{
      s+=`<g transform="translate(${cx-44} ${a.y+a.h-44}) rotate(-5 44 14)"><rect width="88" height="30" rx="8" fill="#fff" stroke="${INK}" stroke-width="3"/><text x="44" y="22" text-anchor="middle" font-family="Mochiy Pop One" font-size="17" fill="${INK}">？？？</text></g>`;
    }
    s+='</g>';
  }
  // ここ！の吹き出し
  if(!S.legDone&&!S.rest) s+=`<g class="bob"><path d="M176 258H252a12 12 0 0 1 12 12V288a12 12 0 0 1-12 12H236L250 322 214 300H176a12 12 0 0 1-12-12V270a12 12 0 0 1 12-12Z" transform="translate(-4 62)" fill="${YEL}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><text x="108" y="287" transform="translate(96 62)" text-anchor="middle" font-family="Mochiy Pop One" font-size="22" fill="${INK}">ここ！</text></g>`;
  // 星のバッジ
  s+=`<g transform="translate(335 528)"><path d="${gearPath(0,0,20,15,8)}" fill="${YEL}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><text y="6" text-anchor="middle" font-family="Mochiy Pop One" font-size="16">${got}</text></g>`;
  $('#map').innerHTML=s;
  $('#zk').textContent=got+'/6';
  const la=$('#legArea');if(la){la.onclick=()=>go('record');la.onkeydown=e=>{if(e.key==='Enter')go('record')}}
}
function renderWeek(){
  const days=[['月','done','胸'],['火','rest','休'],['水','done','背'],['木',S.legDone?'done':S.rest?'rest':'now',S.legDone?'脚':S.rest?'休':'今'],['金','next',''],['土','next',''],['日','next','']];
  $('#week').innerHTML=days.map(d=>`<div class="day ${d[1]}" role="img" aria-label="${d[0]}曜日 ${d[2]||'まだ'}"><i>${d[0]}</i><small>${d[2]}</small></div>`).join('');
}
function renderToday(){
  renderWeek();renderMap();
  const b=$('#go'),t=$('#goTxt'),rb=$('#restBtn');
  b.style.setProperty('--fs','24px');
  if(S.legDone){t.textContent='ずかんへ';b.style.setProperty('--fs','18px');rb.hidden=true}
  else if(S.rest){t.textContent='おやすみ中';b.style.setProperty('--fs','15px');rb.hidden=true}
  else{t.textContent=S.idx>0?'つづき！':'出発！';rb.hidden=false}
}

/* ---------- 記録 ---------- */
function renderRec(){
  const e=EX[S.idx],c=S.cur[S.idx];
  $('#exName').textContent=e.n;
  $('#ghost').textContent=`${e.w}kg × ${e.r}回`;
  $('#recDots').innerHTML=EX.map((_,i)=>`<i class="${i<S.idx?'on':i===S.idx?'cur':''}"></i>`).join('');
  num();
  $('#burst').className='burst';$('#burst').textContent='';
  S.logged=false;$('#doneTxt').textContent='できた！';
}
function num(){const c=S.cur[S.idx];$('#recNum').innerHTML=`${c.w}<small>kg</small> × ${c.r}<small>回</small>`;}
function adj(k,d){if(S.logged)return;const c=S.cur[S.idx];if(k==='w')c.w=Math.max(0,c.w+d);else c.r=Math.max(1,c.r+d);num();const el=$('#recNum');el.animate([{transform:'scale(.92)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:220})}
$('#wm').onclick=()=>adj('w',-5);$('#wp').onclick=()=>adj('w',5);
$('#rm').onclick=()=>adj('r',-1);$('#rp').onclick=()=>adj('r',1);
$('#doneBtn').onclick=()=>{
  const e=EX[S.idx],c=S.cur[S.idx];
  if(!S.logged){
    S.logged=true;
    const dv=(c.w*c.r)-(e.w*e.r),bu=$('#burst');
    bu.textContent=dv>0?(c.r>e.r?`ドドン！ +${c.r-e.r}`:'ドドン！ UP'):dv===0?'いつもどおり！':'ゆるっと OK';
    bu.className='burst';void bu.offsetWidth;bu.className='burst go';
    $('#doneTxt').textContent=S.idx===EX.length-1?'おわり！':'つぎへ';
  }else{
    if(S.idx===EX.length-1){S.legDone=true;S.idx=0;go('today')}
    else{S.idx++;renderRec()}
  }
};
$('#go').onclick=()=>{if(S.legDone)go('me');else if(S.rest)go('rest');else go('record')};
$('#restBtn').onclick=()=>{S.rest=true;go('rest')};
$('#undoRest').onclick=()=>{S.rest=false;go('record')};

/* ---------- おやすみ ---------- */
function renderRest(){
  const st=`stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  let s=`<rect x="4" y="8" width="352" height="318" rx="30" fill="#000"/><rect x="4" y="4" width="352" height="318" rx="30" fill="${PUR}" ${st}/>`;
  s+=`<rect x="8" y="8" width="344" height="310" rx="26" fill="url(#dotsW)"/>`;
  // 月
  s+=`<circle cx="286" cy="64" r="34" fill="${YEL}" ${st}/><circle cx="300" cy="54" r="28" fill="${PUR}" stroke="none"/><path d="M270 38A34 34 0 0 1 320 72" fill="none" ${st}/>`;
  // 星
  for(const [x,y,z] of [[50,48,12],[110,34,9],[170,70,11],[230,28,8],[40,120,8]]) s+=`<path d="M${x} ${y-z}L${x+z*.3} ${y-z*.3}L${x+z} ${y}L${x+z*.3} ${y+z*.3}L${x} ${y+z}L${x-z*.3} ${y+z*.3}L${x-z} ${y}L${x-z*.3} ${y-z*.3}Z" fill="${YEL}" ${st}/>`;
  // 柱
  s+=`<rect x="26" y="130" width="22" height="180" rx="8" fill="${TEAL}" ${st}/><rect x="312" y="130" width="22" height="180" rx="8" fill="${TEAL}" ${st}/>`;
  s+=`<path d="M48 168Q180 330 312 168" fill="none" stroke="${INK}" stroke-width="3"/>`;
  // ハンモック
  s+=`<path d="M46 166Q180 330 314 166L314 188Q180 352 46 188Z" fill="${PINK}" ${st}/>`;
  // 人
  s+=`<g transform="rotate(-4 180 230)"><path d="M92 218Q180 270 270 214Q282 190 262 186Q180 236 104 188Q82 196 92 218Z" fill="${YEL}" ${st}/>`;
  s+=`<circle cx="102" cy="196" r="24" fill="#fff" ${st}/><path d="M92 196Q96 201 101 196M110 196Q114 201 119 196" fill="none" ${st}/><path d="M96 208Q103 213 110 208" fill="none" ${st}/><path d="M80 188Q94 160 124 186Q108 176 80 188Z" fill="${INK}" ${st}/>`;
  s+=`<path d="M268 212Q300 214 308 232" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M268 212Q300 214 308 232" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>`;
  s+=`<text x="132" y="146" font-family="Mochiy Pop One" font-size="26" fill="#fff" stroke="${INK}" stroke-width="6" paint-order="stroke" class="bob">Z</text><text x="160" y="118" font-family="Mochiy Pop One" font-size="20" fill="#fff" stroke="${INK}" stroke-width="5" paint-order="stroke" class="bob">z</text><text x="182" y="98" font-family="Mochiy Pop One" font-size="15" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke" class="bob">z</text>`;
  $('#restSvg').innerHTML=s;
}

/* ---------- なかま ---------- */
const FR=[
 {n:'ケン',d:4,rest:0,c:'ベンチ 5kg ふえた！',col:PINK,hair:INK},
 {n:'ミホ',d:2,rest:1,c:'ランで 5km いけた',col:TEAL,hair:'#6B4BD8'},
 {n:'ユウタ',d:3,rest:0,c:'スクワット つらい…',col:YEL,hair:INK},
 {n:'サキ',d:1,rest:2,c:'のんびり 休み中',col:PUR,hair:PINK}];
const ST=[
 {k:'heart',p:'M50 74C20 54 24 30 42 30C46 30 50 34 50 36C50 34 54 30 58 30C76 30 80 54 50 74Z',f:'#FF4F8B'},
 {k:'star',p:'M50 24L58 42L77 44L63 57L67 76L50 66L33 76L37 57L23 44L42 42Z',f:'#FFD23F'},
 {k:'bolt',p:'M56 22L34 54H48L44 78L68 44H53Z',f:'#1FB5A0'}];
function face(col,hair,i){
  return `<svg viewBox="0 0 60 60" width="56" height="56" aria-hidden="true"><circle cx="30" cy="31" r="25" fill="${col}" stroke="${INK}" stroke-width="3"/><circle cx="22" cy="30" r="2.6" fill="${INK}"/><circle cx="38" cy="30" r="2.6" fill="${INK}"/><path d="M22 40Q30 47 38 40" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M8 28Q10 8 30 8Q50 8 52 28Q40 16 8 28Z" fill="${hair}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
function renderBoard(){
  $('#board').innerHTML=FR.map((f,i)=>{
    const mini=Array.from({length:7},(_,j)=>`<i class="${j<f.d?'on':j>=f.d&&j<f.d+f.rest?'r':''}"></i>`).join('');
    const st=ST.map(s=>{const key=i+s.k,n=S.stamps[key]||0;return `<div class="stwrap" data-key="${key}"><button class="gear" data-fill="${s.f}" data-teeth="9" style="--s:44px" aria-label="${f.n}に${s.k}のスタンプ"><svg viewBox="0 0 100 104" class="ic" aria-hidden="true" style="z-index:2"><path d="${s.p}" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></svg></button><span class="cnt" ${n?'':'hidden'}>${n}</span></div>`}).join('');
    return `<article class="fc"><div>${face(f.col,f.hair,i)}</div><div class="nm">${f.n}</div><div class="dd"><b>${f.d}</b>日${f.rest?' ・休み'+f.rest:''}</div><div class="mini" aria-hidden="true">${mini}</div><div class="bub">${f.c}</div><div class="stamps">${st}</div></article>`}).join('');
  decorateGears($('#board'));
  document.querySelectorAll('#board .gear .ic').forEach(el=>el.parentNode.appendChild(el)); // アイコンを前面へ
  document.querySelectorAll('#board .stwrap').forEach(w=>{w.querySelector('button').onclick=()=>{
    const k=w.dataset.key;S.stamps[k]=(S.stamps[k]||0)+1;const c=w.querySelector('.cnt');c.hidden=false;c.textContent=S.stamps[k];
    w.classList.remove('hit');void w.offsetWidth;w.classList.add('hit');}});
}

/* ---------- ずかん ---------- */
function renderMe(){
  $('#bodyF').innerHTML=body('f');$('#bodyB').innerHTML=body('b');
  $('#plist').innerHTML=['chest','shoulder','arm','back','abs','leg'].map(k=>{const n=sets(k),l=lvl(n);return `<div class="pi" style="background:${l?['','#C9F0EA','#FFF0B3','#FFD0E0'][l]:'#fff'}"><span>${NAMES[k]}</span><b>${n}<small style="font-family:'Zen Maru Gothic';font-size:12px">セット</small></b></div>`}).join('');
}

/* ---------- ルーター ---------- */
const VIEWS=['today','record','rest','friends','me'];
function go(v){location.hash='#'+v}
function route(){
  let v=(location.hash||'#today').slice(1);if(!VIEWS.includes(v))v='today';
  VIEWS.forEach(x=>$('#v-'+x).hidden=x!==v);
  $('#v-'+v).scrollTop=0;
  if(v==='today')renderToday();
  if(v==='record')renderRec();
  if(v==='rest')renderRest();
  if(v==='friends')renderBoard();
  if(v==='me')renderMe();
  decorateGears();
}
addEventListener('hashchange',route);
decorateGears();route();
</script>
</body>
</html>
