<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitLog v8 キャラの編集画面（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--t:#17A2A6;--td:#0E7F83;--ink:#1E2A3A;--sub:#6B7280;--n:#E5E7EB;--face:#F4F6F8;--pl:#EAE6FF;--lav:#8F7BEB;--lavd:#6F5BD0}
*{box-sizing:border-box}
body{margin:0;background:#E8ECEF;color:var(--ink);font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;padding:0 0 110px;position:relative}
header{display:flex;align-items:center;gap:10px;padding:14px 16px}
header h1{font-size:18px;margin:0;font-weight:800}
header .proto{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700}
.stage{position:relative;margin:4px 16px 0;height:290px;display:flex;align-items:flex-end;justify-content:center}
.stage::before{content:"";position:absolute;left:50%;bottom:22px;width:250px;height:50px;margin-left:-125px;border-radius:50%;background:var(--pl)}
.stage canvas{position:relative;width:256px;height:256px;image-rendering:pixelated}
.poses{display:flex;gap:8px;justify-content:center;margin:6px 16px 0}
.chip{border:0;background:var(--face);color:var(--ink);font:inherit;font-size:13px;padding:10px 14px;min-height:44px;border-radius:14px;box-shadow:0 3px 0 var(--n);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
section{padding:14px 16px 0}
section h2{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:800;letter-spacing:.02em}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.body-chip{flex:1;min-width:120px}
.hair{width:64px;height:64px;padding:0;border:0;background:var(--face);border-radius:16px;box-shadow:0 3px 0 var(--n);cursor:pointer;overflow:hidden}
.hair canvas{width:64px;height:64px;image-rendering:pixelated;display:block}
.hair[aria-pressed="true"]{box-shadow:0 0 0 3px var(--t),0 3px 0 var(--td)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--n),0 3px 0 var(--n);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--t),0 3px 0 var(--td)}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;padding:14px 16px 18px;background:linear-gradient(#fff0,#fff 30%)}
.ok{display:block;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--t);color:#fff;font:inherit;font-size:18px;font-weight:800;box-shadow:0 5px 0 var(--td);cursor:pointer}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header><h1>キャラをつくる</h1><span class="proto">試作（保存はこの端末だけ）</span></header>
<div class="stage"><canvas id="main" width="64" height="64" role="img" aria-label="編集中のキャラ"></canvas></div>
<div class="poses" id="poses" role="group" aria-label="見せるポーズ"></div>

<section><h2>からだ</h2><div class="opts" id="bodies"></div></section>
<section><h2>かみがた</h2><div class="opts" id="hairs"></div></section>
<section><h2>かみのいろ</h2><div class="opts" id="hairColors"></div></section>
<section><h2>ふくのいろ</h2><div class="opts" id="shirtColors"></div></section>
<section><h2>ズボンのいろ</h2><div class="opts" id="pantsColors"></div></section>
</div>
<div class="bar"><button class="ok" id="save">これでOK</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* LPC の部品（グレーの元絵）を重ね、色はこの画面の中で塗り替える。しくみは F-32:
   体は2種（男・女）／髪・服は部品を重ねる／色は画面の中でパレット置換（輝度を保って指定色に染める） */
const A = '../assets/lpc/';
const BODIES = {male:{label:'男性', head:'head/heads/human/male', body:'body/bodies/male', torso:'torso/clothes/shortsleeve/tshirt/male', legs:'legs/shorts/shorts/male', feet:'feet/shoes/basic/male'},
                female:{label:'女性', head:'head/heads/human/female', body:'body/bodies/female', torso:'torso/clothes/shortsleeve/tshirt/female', legs:'legs/shorts/shorts/thin', feet:'feet/shoes/basic/thin'}};
const HAIRS = [['buzzcut','角刈り'],['plain','ふつう'],['spiked','ツンツン'],['parted_side_bangs','分け目'],['natural','ナチュラル']];
const HAIR_COLORS = [['#2A1F1C','くろ'],['#6B4630','ちゃ'],['#D9A93E','きん'],['#A5482C','あか'],['#9AA0A8','はい'],['#8F7BEB','むらさき']];
const SHIRT_COLORS = [['#17A2A6','ティール'],['#8F7BEB','ラベンダー'],['#FFC21A','ゴールド'],['#FF7A9A','ピンク'],['#2F4A7A','こん'],['#E5484D','あか'],['#3DAA6D','みどり'],['#F2F4F7','しろ']];
const PANTS_COLORS = [['#1E2A3A','こん'],['#262626','くろ'],['#6B7280','グレー'],['#0E7F83','ティール']];
const POSES = [['idle','たいき',[0,1],'idle'],['arms','うでを広げる',[2],'emote'],['sit','すわる',[2],'sit']];   // [キー, 名前, 使うコマ, 素材の動き]
const ROW = 2;   // 正面向き
let state = {sex:'male', hair:'buzzcut', hairColor:'#2A1F1C', shirt:'#17A2A6', pants:'#1E2A3A', pose:'idle'};
try{ Object.assign(state, JSON.parse(localStorage.getItem('fitlog-char-v8')||'{}')); }catch(e){}

const imgCache = {}, tintCache = {};
function load(path){ return imgCache[path] || (imgCache[path] = new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(path); im.src=path; })); }
function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
/* パレット置換: 元絵の明るさ（輝度）を保ったまま、指定の色に染める */
function tinted(im, key, color){
  const k = key+'|'+color; if(tintCache[k]) return tintCache[k];
  const c = document.createElement('canvas'); c.width=im.width; c.height=im.height;
  const g = c.getContext('2d'); g.drawImage(im,0,0);
  const d = g.getImageData(0,0,c.width,c.height), px = d.data, [R,G,B] = hex(color);
  for(let i=0;i<px.length;i+=4){
    if(!px[i+3]) continue;
    const l = (px[i]*299+px[i+1]*587+px[i+2]*114)/255000, f = (.35+.65*l)*1.15;
    px[i]=Math.min(255,R*f); px[i+1]=Math.min(255,G*f); px[i+2]=Math.min(255,B*f);
  }
  g.putImageData(d,0,0); return (tintCache[k]=c);
}
async function layers(s, anim){
  const b = BODIES[s.sex], hairPath = `hair/${s.hair}/adult`;
  const parts = [[b.body,null],[b.head,null],[b.feet,'#EBEBEB'],[b.legs,s.pants],[b.torso,s.shirt],[hairPath,s.hairColor]];
  return Promise.all(parts.map(async ([p,col])=>{ const im = await load(`${A}${p}/${anim}.png`); return col ? tinted(im,p+'/'+anim,col) : im; }));
}
async function draw(cv, s, anim, frame, crop){
  const L = await layers(s, anim), g = cv.getContext('2d'); g.imageSmoothingEnabled=false;
  g.clearRect(0,0,cv.width,cv.height);
  if(!crop){ g.fillStyle='rgba(30,42,58,.2)'; g.beginPath(); g.ellipse(32,60,13,2.6,0,0,7); g.fill(); }   // 足元の影
  for(const im of L){
    if(crop) g.drawImage(im, frame*64+crop.x, ROW*64+crop.y, crop.w, crop.h, 0, 0, cv.width, cv.height);
    else g.drawImage(im, frame*64, ROW*64, 64, 64, 0, 0, 64, 64);
  }
}
function pressed(btn, group){ group.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed', b===btn)); }
function opt(parent, cls, label, on, fn, content){
  const b = document.createElement('button'); b.className = cls; b.setAttribute('aria-label', label); b.setAttribute('aria-pressed', on);
  if(content) content(b); b.onclick = ()=>{ fn(); pressed(b, parent); refresh(); }; parent.appendChild(b); return b;
}
function swatches(id, list, key){
  const el = document.getElementById(id);
  list.forEach(([col,name])=>opt(el,'sw',name,state[key]===col,()=>{state[key]=col},b=>b.style.background=col));
}
const bodiesEl = document.getElementById('bodies');
Object.entries(BODIES).forEach(([k,v])=>opt(bodiesEl,'chip body-chip',v.label,state.sex===k,()=>{state.sex=k},b=>b.textContent=v.label));
const posesEl = document.getElementById('poses');
POSES.forEach(([k,name])=>opt(posesEl,'chip',name,state.pose===k,()=>{state.pose=k},b=>b.textContent=name));
swatches('hairColors',HAIR_COLORS,'hairColor'); swatches('shirtColors',SHIRT_COLORS,'shirt'); swatches('pantsColors',PANTS_COLORS,'pants');
const hairsEl = document.getElementById('hairs'), hairBtns = [];
HAIRS.forEach(([k,name])=>{ const cv = document.createElement('canvas'); cv.width=cv.height=64;
  const b = opt(hairsEl,'hair',name,state.hair===k,()=>{state.hair=k},bb=>bb.appendChild(cv)); hairBtns.push([k,cv]); });

let tick = 0;
function refresh(){
  const [,,frames,anim] = POSES.find(p=>p[0]===state.pose);
  draw(document.getElementById('main'), state, anim, frames[tick % frames.length]);
  hairBtns.forEach(([k,cv])=>draw(cv, {...state, hair:k}, 'idle', 0, {x:12,y:8,w:40,h:40}));   // 髪型のサムネ（頭まわりだけ切り出す）
}
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
refresh();
if(!reduce) setInterval(()=>{ tick++; const [,,frames,anim] = POSES.find(p=>p[0]===state.pose); draw(document.getElementById('main'), state, anim, frames[tick % frames.length]); }, 600);

document.getElementById('save').onclick = ()=>{
  let msg = '保存しました（試作・この端末だけ）';
  try{ localStorage.setItem('fitlog-char-v8', JSON.stringify(state)); }catch(e){ msg = '保存できませんでした（ブラウザの設定）'; }
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1800);
};
</script>
</body>
</html>
