<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitLog 見た目4案の比較</title>
  <style>
    body { margin: 0; font-family: "Zen Maru Gothic", system-ui, sans-serif; background: #2B2D42; color: #fff; }
    header { position: sticky; left: 0; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h1 { font-size: 16px; margin: 0 12px 0 0; }
    button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 2px solid #74768B; background: transparent; color: #fff; cursor: pointer; }
    button[aria-pressed="true"] { background: #F55D3E; border-color: #F55D3E; }
    .row { display: flex; gap: 20px; padding: 0 20px 24px; overflow-x: auto; }
    figure { margin: 0; flex: none; }
    figcaption { font-weight: 800; margin-bottom: 8px; text-align: center; }
    iframe { width: 390px; height: 780px; border: 0; border-radius: 18px; background: #FFF8EC; }
  </style>
</head>
<body>
  <header>
    <h1>見た目4案を同時に比べる</h1>
    <span id="pages"></span>
  </header>
  <div class="row" id="row"></div>
  <script>
    const looks = [["now", "いま"], ["mid", "中間（一部だけふざける）"], ["bold", "全部ふざける"], ["calm", "整える"]];
    const pages = [["today.html", "今日"], ["record-strength.html", "記録"], ["friends.html", "仲間"], ["me.html", "自分"], ["detail.html", "記録をくわしく"]];
    const row = document.getElementById("row");
    // 枠の名前で見た目を固定する（shared.js が読む）。枠の中で画面を移動しても見た目は変わらない
    row.innerHTML = looks.map(([k, label]) => `<figure><figcaption>${label}</figcaption><iframe name="look:${k}" src="today.html" title="${label}"></iframe></figure>`).join("");
    const bar = document.getElementById("pages");
    bar.innerHTML = pages.map(([href, label], i) => `<button type="button" data-href="${href}" aria-pressed="${i === 0}">${label}</button>`).join(" ");
    bar.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      bar.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      row.querySelectorAll("iframe").forEach((f) => f.contentWindow.location.replace(b.dataset.href));
    });
  </script>
</body>
</html>
