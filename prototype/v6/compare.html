<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitLog v6 混ぜ方の比較</title>
  <style>
    body { margin: 0; font-family: "Noto Sans JP", system-ui, sans-serif; background: #E9EBEE; color: #333; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; background: #E9EBEEee; border-bottom: 1px solid #D5D8DD; }
    h1 { font-size: 16px; margin: 0 12px 0 0; }
    header button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 6px; border: 1px solid #C5C9CF; background: #fff; cursor: pointer; }
    header button[aria-pressed="true"] { background: #333; color: #fff; border-color: #333; }
    table { border-collapse: separate; border-spacing: 16px 14px; margin: 0 4px; }
    th { font-size: 14px; text-align: left; vertical-align: top; }
    th dl { margin: 6px 0 0; width: 170px; font-size: 12px; font-weight: 400; line-height: 1.5; }
    th dt { color: #888; margin-top: 4px; }
    th dd { margin: 0; }
    .cell { width: calc(390px * var(--s)); height: calc(844px * var(--s)); overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .15); position: relative; }
    .cell iframe { width: 390px; height: 844px; border: 0; transform: scale(var(--s)); transform-origin: 0 0; }
    .cell a { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <header>
    <h1>v6 Duolingo 型＋実用型＋運動らしさ（混ぜ方3案＋土台2つ）</h1>
    <span>縮小:</span>
    <button type="button" data-s="0.45" aria-pressed="true">小</button>
    <button type="button" data-s="0.6" aria-pressed="false">中</button>
    <button type="button" data-s="1" aria-pressed="false">原寸</button>
    <span style="font-size:12px;color:#666">画面を押すと、そのパターンを別タブで触れます</span>
  </header>
  <table id="grid"></table>
  <script>
    // 行＝パターン（強み・ボタン構成・雰囲気つき）、列＝画面
    const plans = [
      ["m1-path.html", "M1 道＋帯", "今やる1つが道の上で光る。上の帯で今週もひと目", "ティールの日付の帯＋縦の道の丸ボタン＋下に固定の「はじめる」", "Duolingo の道＋実用型の帯＋斜体の数字"],
      ["m2-tiles.html", "M2 タイル＋厚み", "全種目の前回値がひと目。次の1枚だけ色が付く", "7つの丸＋2列の厚みタイル＋下に「はじめる」と「休む」", "実用型のタイルを厚みボタンに＋NEXT の札"],
      ["m3-hero.html", "M3 次の1枚", "次の種目を大きく1枚。残りは一覧で軽く", "得点板の帯＋大きなカードの中の「はじめる」＋一覧の行", "得点板・斜めの縞・ユニフォームの番号"],
      ["../v5/p1-duo.html", "参考 P1 Duolingo型", "迷わない（土台）", "縦の道＋下に固定の厚みボタン", "平らな塗り・線なし・厚み"],
      ["../v4/index.html", "参考 v4-A 実用型", "ひと目で全種目（土台）", "日付の帯＋2列タイル＋右下の丸ボタン", "ティール・地味な作法"],
    ];
    const screens = [["today", "今日"], ["record", "記録中"], ["rest", "休みの日"], ["friends", "仲間"], ["me", "自分（ヒートマップ）"]];
    const grid = document.getElementById("grid");
    grid.innerHTML = `<tr><th></th>${screens.map(([, l]) => `<th>${l}</th>`).join("")}</tr>` +
      plans.map(([f, name, strong, buttons, mood]) => `<tr><th>${name}<dl><dt>強み</dt><dd>${strong}</dd><dt>ボタン構成</dt><dd>${buttons}</dd><dt>雰囲気</dt><dd>${mood}</dd></dl></th>${screens.map(([h]) =>
        `<td><div class="cell"><iframe loading="lazy" src="${f}#${h}" title="${name} ${h}" tabindex="-1"></iframe><a href="${f}#${h}" target="_blank" rel="noopener" aria-label="${name}の${h}を開く"></a></div></td>`).join("")}</tr>`).join("");
    const setScale = (s) => document.documentElement.style.setProperty("--s", s);
    setScale(0.45);
    document.querySelector("header").addEventListener("click", (e) => {
      const b = e.target.closest("[data-s]"); if (!b) return;
      document.querySelectorAll("[data-s]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      setScale(b.dataset.s);
    });
  </script>
</body>
</html>
