<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitLog v4 D フィード型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  /* VARIANTS.md D の節 + DESIGN.md 2章 */
  --primary:#FC5A2B;
  --band:#F2F3F5; --bg:#FFFFFF; --pill:#F1F1F1;
  --text:#333333; --text-num:#555555; --text-sub:#888888; --text-note:#666666;
  --win:#F28C28; --friend:#F27C9B; --rest-bg:#E3F4EF; --rest-text:#3E8E6E;
  --heat-1:#3B8BF5; --heat-2:#2EC4B6; --heat-3:#F5D33B; --heat-4:#E84B3C;
  --bar-bg:#E6E6E6; --btn-bg:#EFEFEF;
  --tab-h:68px; --min-tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bar-bg);font-family:"Noto Sans JP",sans-serif;color:var(--text);font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-family:Roboto,"Noto Sans JP",sans-serif}
.phone{position:relative;width:min(390px,100vw);height:min(844px,100vh);background:var(--band);overflow:hidden}
.screen{display:none;position:absolute;left:0;right:0;top:0;bottom:var(--tab-h);overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.full{bottom:0;background:var(--bg)}
.screen.on{display:block}
.blk{background:var(--bg);padding:14px;margin-bottom:8px}
.icon-btn{width:var(--min-tap);height:var(--min-tap);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:24px;height:24px}
/* 上の見出し */
.hd{padding:4px 14px 14px}
.hd-top{display:flex;justify-content:space-between;align-items:center;height:48px;font-size:18px;font-weight:700}
.hd-top .icon-btn{margin-right:-10px}
.wk7{display:flex;align-items:center;gap:4px}
.sq{width:36px;height:36px;border-radius:8px;border:1px solid var(--bar-bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-sub);flex:none}
.sq.rec{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.sq.rest{background:var(--rest-bg);border-color:var(--rest-bg);color:var(--rest-text)}
.sq svg{width:16px;height:16px}
.wk7 .cnt{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.title{height:52px;line-height:52px;text-align:center;font-size:17px;font-weight:700}
/* 今日のメニュー */
.menu .lb{font-size:12px;color:var(--text-sub)}
.menu .nm{font-size:17px;font-weight:700;margin-top:2px}
.menu .ds{font-size:13px;color:var(--text-note);margin-top:2px}
.menu .btns{display:flex;gap:8px;margin-top:12px}
.go{flex:1;height:48px;border-radius:24px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.go:active{opacity:.85}
.ghost{width:96px;height:48px;border-radius:24px;border:1px solid var(--primary);color:var(--primary);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.ghost svg{width:18px;height:18px}
/* フィード */
.frow{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.fname{flex:1;min-width:0}
.fname b{display:block;font-size:15px;font-weight:700}
.fname span{font-size:12px;color:var(--text-sub)}
.pill{display:block;width:max-content;margin-top:12px;background:var(--pill);border-radius:12px;padding:3px 10px;font-size:12px;font-family:Roboto,"Noto Sans JP",sans-serif}
.dist{margin-top:8px;font-family:Roboto,sans-serif;font-weight:700;font-size:40px;line-height:1.2}
.dist small{font-size:14px;margin-left:4px}
.dist.rest{font-family:"Noto Sans JP",sans-serif;font-size:26px;color:var(--rest-text)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:12px 0}
.cols3>div+div{border-left:1px solid var(--bar-bg)}
.cols3 b{display:block;font-family:Roboto,sans-serif;font-size:15px;font-weight:700}
.cols3 span{font-size:10px;color:var(--text-sub)}
.map{display:block;width:100%;height:140px}
.stamps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stamp{min-height:var(--min-tap);padding:0 14px;border-radius:22px;background:var(--btn-bg);font-size:13px;display:flex;align-items:center;gap:6px}
.stamp b{font-family:Roboto,sans-serif;font-weight:500;font-size:13px}
.stamp.on{background:rgb(242 124 155 / .15);color:var(--friend);font-weight:500}
.stamp.rest.on{background:var(--rest-bg);color:var(--rest-text)}
/* 休み */
.restpost{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px}
.restpost p{margin:0;font-size:17px;font-weight:700;color:var(--rest-text)}
.undo{font-size:13px;color:var(--rest-text);text-decoration:underline;min-height:var(--min-tap);padding:0 14px}
.pix{shape-rendering:crispEdges;display:block}
.pix .f0{animation:b0 1.6s steps(1) infinite}
.pix .f1{animation:b1 1.6s steps(1) infinite}
@keyframes b0{0%{opacity:1}50%{opacity:0}}
@keyframes b1{0%{opacity:0}50%{opacity:1}}
.pix .z{animation:zf 2.4s ease-in-out infinite;opacity:0}
.pix .z1{animation-delay:0s}.pix .z2{animation-delay:.8s}.pix .z3{animation-delay:1.6s}
@keyframes zf{0%{transform:translate(0,3px);opacity:0}30%{opacity:1}100%{transform:translate(1px,-3px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pix .f0,.pix .f1,.pix .z{animation:none}.pix .f1{opacity:0}.pix .z{opacity:1}}
/* 仲間 */
.faces{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.faces::-webkit-scrollbar{display:none}
.face{flex:none;width:56px;text-align:center}
.face .av{width:56px;height:56px;font-size:20px}
.face span{display:block;font-size:11px;margin-top:4px}
.pw{padding:14px}
.pw .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pw .t b{font-size:14px;font-weight:700}
.pw .t span{font-size:13px;font-weight:700}
/* 自分 */
.prof{text-align:center}
.prof .av{width:72px;height:72px;font-size:28px;margin:0 auto}
.prof .pn{font-size:17px;font-weight:700;margin-top:8px}
.prof .cols3{margin:14px 0 0}
.card-h{font-size:14px;font-weight:500;margin:0 0 8px}
.note{font-size:9px;color:var(--text-sub);margin-top:8px}
.heat{display:flex;gap:8px}
.bodies{display:flex;gap:0;flex:none}
.bodies svg{width:92px;height:220px}
.bars{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0 0 8px}
.bar{display:flex;align-items:flex-end;gap:8px}
.bar .nm{width:36px;font-size:13px}
.bar .rt{flex:1}
.bar .tp{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);line-height:14px}
.bar .tr{height:7px;border-radius:4px;background:var(--bar-bg);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.legend{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--heat-1),var(--heat-2),var(--heat-3),var(--heat-4));margin-top:14px}
.legend-l{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);margin-top:4px}
/* 記録 */
.offline{display:none;height:28px;line-height:28px;background:var(--rest-bg);color:var(--rest-text);font-size:11px;text-align:center}
.offline.on{display:block}
.rec-top{display:flex;align-items:center;height:52px;padding:0 4px}
.rec-name{text-align:center;margin-top:8px}
.rec-name b{display:block;font-size:17px;font-weight:700}
.rec-name span{font-size:13px;color:var(--text-sub)}
.big-val{text-align:center;margin-top:20px;font-family:Roboto,sans-serif;font-weight:700;color:var(--text-num);line-height:1.1;position:relative}
.big-val b{font-size:48px;position:relative;display:inline-block}
.big-val small{font-size:17px;font-weight:700;margin:0 6px 0 2px}
.big-val b.win{color:var(--win)}
.float{position:absolute;left:50%;top:-6px;font-size:17px;color:var(--win);font-weight:700;animation:fl .6s ease-out forwards;pointer-events:none}
@keyframes fl{from{transform:translateY(0);opacity:1}to{transform:translateY(-20px);opacity:0}}
.steps{display:flex;justify-content:center;gap:32px;margin-top:20px}
.step{display:flex;align-items:center;gap:8px}
.step .l{font-size:13px;color:var(--text-sub);width:28px;text-align:center}
.step button{width:var(--min-tap);height:var(--min-tap);border-radius:50%;background:var(--btn-bg);display:flex;align-items:center;justify-content:center;color:var(--text-note)}
.step button svg{width:24px;height:24px}
.done-btn{display:block;margin:24px 14px 0;width:calc(100% - 28px);height:56px;border-radius:28px;background:var(--primary);color:#fff;font-size:17px;font-weight:700}
.done-btn:active{opacity:.85}
.diffs{margin:20px 14px 0;font-size:13px}
.diffs .r{display:flex;justify-content:space-between;line-height:32px;border-bottom:1px solid var(--band)}
.diffs .r span:last-child{color:var(--text-sub)}
.diffs .r.win span:last-child{color:var(--win);font-weight:700}
.timer{text-align:center;font-size:13px;color:var(--text-sub);margin-top:12px;min-height:20px;font-family:Roboto,"Noto Sans JP",sans-serif}
.tiny{display:block;margin:8px auto 0;font-size:10px;color:var(--text-sub);min-height:var(--min-tap)}
/* 下のタブ */
.tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tab-h);background:#fff;box-shadow:0 -1px 4px rgb(0 0 0 / .08);display:flex}
.tabs.off{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--text-sub);min-height:var(--min-tap)}
.tab .ic{width:64px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}
.tab.on .ic{background:rgb(252 90 43 / .1)}
</style>
</head>
<body>
<div class="phone" id="phone">

<!-- 今日 -->
<section class="screen" id="s-today" data-tab="today">
  <div class="blk hd" data-hd="week"></div>
  <div class="blk menu">
    <div class="lb">今日のメニュー</div>
    <div class="nm">脚の日</div>
    <div class="ds">4種目　前回の総重量 <span class="num">9,000</span> kg</div>
    <div class="btns">
      <a class="go" href="#record">はじめる</a>
      <button class="ghost" id="rest-btn"><i data-lucide="moon"></i>休む</button>
    </div>
  </div>
  <div id="feed"></div>
</section>

<!-- 休み -->
<section class="screen" id="s-rest" data-tab="today">
  <div class="blk hd" data-hd="week"></div>
  <article class="blk">
    <div class="frow"><div class="av" style="background:var(--primary)">私</div><div class="fname"><b>あなた</b><span>10/29（木）今日</span></div></div>
    <span class="pill">2026.10.29</span>
    <div class="restpost">
      <div id="pix"></div>
      <p>今日は休み</p>
      <button class="undo" id="undo">取り消し</button>
    </div>
  </article>
  <div id="feed2"></div>
</section>

<!-- 記録 -->
<section class="screen full" id="s-record">
  <div class="offline" id="offbar">オフライン: 端末に保存しました。つながったら送ります</div>
  <div class="rec-top">
    <a class="icon-btn" href="#today" aria-label="閉じる"><i data-lucide="x"></i></a>
  </div>
  <div class="rec-name"><b>スクワット</b><span id="setno"></span></div>
  <div class="big-val" id="bigv"></div>
  <div class="steps">
    <div class="step"><button id="wm" aria-label="重さを減らす"><i data-lucide="minus"></i></button><span class="l">kg</span><button id="wp" aria-label="重さを増やす"><i data-lucide="plus"></i></button></div>
    <div class="step"><button id="rm" aria-label="回数を減らす"><i data-lucide="minus"></i></button><span class="l">回</span><button id="rp" aria-label="回数を増やす"><i data-lucide="plus"></i></button></div>
  </div>
  <button class="done-btn" id="done">できた</button>
  <div class="timer" id="timer"></div>
  <div class="diffs" id="diffs"></div>
  <button class="tiny" id="offtoggle">確認用: オフライン表示を切り替え</button>
</section>

<!-- 仲間 -->
<section class="screen" id="s-friends" data-tab="friends">
  <div class="blk" style="padding:0 14px"><div class="title">仲間</div></div>
  <div class="blk"><div class="faces" id="faces"></div></div>
  <div id="pweeks"></div>
</section>

<!-- 自分 -->
<section class="screen" id="s-me" data-tab="me">
  <div class="blk" style="padding:0 14px"><div class="title">自分</div></div>
  <div class="blk prof">
    <div class="av" style="background:var(--primary)">私</div>
    <div class="pn">あなた</div>
    <div class="cols3">
      <div><b>2日</b><span>今週の動いた日</span></div>
      <div><b>8,000 kg</b><span>今週の総重量</span></div>
      <div><b>3回</b><span>前回超え</span></div>
    </div>
  </div>
  <div class="blk">
    <h2 class="card-h">今週鍛えた部位</h2>
    <div class="heat"><div class="bodies"></div><div class="bars"></div></div>
    <div class="legend"></div>
    <div class="legend-l"><span>低</span><span>高</span></div>
    <div class="note">※ 週の目安 10セット を 100% とした割合</div>
  </div>
</section>

<nav class="tabs" id="tabs">
  <a class="tab" data-t="today" href="#today"><span class="ic"><i data-lucide="dumbbell"></i></span>今日</a>
  <a class="tab" data-t="friends" href="#friends"><span class="ic"><i data-lucide="users"></i></span>仲間</a>
  <a class="tab" data-t="me" href="#me"><span class="ic"><i data-lucide="user"></i></span>自分</a>
</nav>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const st={rested:false};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function icons(){lucide.createIcons();}

/* 見出し＋今週の7マス */
const WEEK=[["月","rec"],["火","rest"],["水","rec"],["木","today"],["金",""],["土",""],["日",""]];
function weekHTML(){
  return WEEK.map(([w,k])=>{
    if(k==="rest"||(k==="today"&&st.rested))return `<div class="sq rest" aria-label="${w}曜 休み"><i data-lucide="moon"></i></div>`;
    return `<div class="sq ${k==="rec"?"rec":""}" aria-label="${w}曜${k==="rec"?" 記録あり":""}">${w}</div>`;
  }).join("");
}
function renderHd(){
  $$("[data-hd]").forEach(h=>h.innerHTML=`<div class="hd-top"><span>朝トレ部</span><button class="icon-btn" aria-label="通知"><i data-lucide="bell"></i></button></div><div class="wk7">${weekHTML()}<span class="cnt">今週 <span class="num">2</span>日</span></div>`);
}

/* ドット絵(1マス4px・40x18) */
(function(){
  const HAIR="#C2462C",SKIN="#F2B68C",SKIN2="#E39F72",MINT="#8FD3B6",EDGE="#5FB08F",MAT="#3E8E6E",MATTOP="#7CCBA5",PIL="#FFFFFF",PIL2="#D5E3DE",EYE="#5A2E22";
  const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  const mat=R(0,13,40,5,MAT)+R(0,13,40,1,MATTOP);
  const pillow=R(0,10,10,3,PIL)+R(0,12,10,1,PIL2)+R(0,10,1,1,PIL2);
  const head=R(3,7,6,4,SKIN)+R(3,6,6,1,HAIR)+R(2,7,2,3,HAIR)+R(4,10,1,1,HAIR)+R(6,8,2,1,EYE)+R(7,9,1,1,"#E98F7A");
  const feet=R(34,9,2,4,SKIN)+R(34,9,2,1,SKIN2);
  const blanket=R(9,9,25,1,EDGE)+R(9,10,25,2,MINT)+R(9,12,25,1,EDGE)+R(33,10,1,2,EDGE)+R(9,10,1,2,EDGE);
  const base=pillow+head+feet+blanket;
  const up=R(14,8,8,1,EDGE)+R(14,9,8,1,MINT);
  const zN=(n)=>(x,y,c)=>{let o=R(x,y,n,1,c)+R(x,y+n-1,n,1,c);for(let i=1;i<n-1;i++)o+=R(x+n-1-i,y+i,1,1,c);return o};
  const z3=zN(4),z4=zN(5),z5=zN(6);
  $("#pix").innerHTML=`<svg class="pix" viewBox="0 0 40 18" width="280" height="126" role="img" aria-label="マットの上で布団をかけて仰向けに寝ている人">${mat}<g class="f0">${base}</g><g class="f1">${base}${up}</g><g class="z z1">${z3(10,4,MAT)}</g><g class="z z2">${z4(15,2,MAT)}</g><g class="z z3">${z5(21,0,MAT)}</g></svg>`;
})();

/* ルートの絵（フィード用・高さ140） */
function routeSVG(){
  let g="";
  for(let x=0;x<=374;x+=34)g+=`<line x1="${x}" y1="0" x2="${x}" y2="140" stroke="#E6E6E6"/>`;
  for(let y=0;y<=140;y+=34)g+=`<line x1="0" y1="${y}" x2="374" y2="${y}" stroke="#E6E6E6"/>`;
  const raw="40,240 70,200 110,190 140,150 120,110 150,70 210,60 250,90 300,80 330,120 310,170 270,200 220,230 160,250 100,260 40,240".split(" ").map(p=>p.split(",").map(Number));
  const pts=raw.map(([x,y])=>`${x},${((y-50)*0.6+8).toFixed(1)}`).join(" ");
  const s=raw[0],e=raw[14];
  g+=`<polyline points="${pts}" fill="none" stroke="#FC5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=`<circle cx="${s[0]}" cy="${((s[1]-50)*0.6+8).toFixed(1)}" r="7" fill="#fff" stroke="#FC5A2B" stroke-width="4"/><circle cx="${e[0]}" cy="${((e[1]-50)*0.6+8).toFixed(1)}" r="7" fill="#1A1A1A"/>`;
  return `<svg class="map" viewBox="0 0 374 140" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ランのルート">${g}</svg>`;
}

/* フィード */
const FR=[
 {n:"ケン",c:"--friend",t:"10/29（木）06:40",d:"2026.10.29",run:true,v:"4.10",u:"km",cols:[["24:30","時間"],["5'58\"","ペース"],["5,010","歩数"]]},
 {n:"ミホ",c:"--win",t:"10/28（水）19:05",d:"2026.10.28",v:"3,700",u:"kg",cols:[["3","種目数"],["9","セット数"],["1","前回超え"]]},
 {n:"あなた",c:"--primary",t:"10/28（水）07:12",d:"2026.10.28",run:true,mine:true,v:"5.20",u:"km",cols:[["31:05","時間"],["5'59\"","ペース"],["6,120","歩数"]]},
 {n:"ユウタ",c:"--heat-1",t:"10/27（火）21:30",d:"2026.10.27",v:"2,950",u:"kg",cols:[["3","種目数"],["9","セット数"],["0","前回超え"]]},
 {n:"サキ",c:"--heat-2",t:"10/27（火）",d:"2026.10.27",rest:true}
];
function feedHTML(){
  return FR.map(f=>{
    const ini=f.n==="あなた"?"私":f.n[0];
    const body=f.rest?`<div class="dist rest">休み</div>`
      :`<div class="dist">${f.v}<small>${f.u}</small></div><div class="cols3">${f.cols.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>${f.run?routeSVG():""}`;
    const stamps=f.mine?"":f.rest?`<div class="stamps"><button class="stamp rest" data-n="2"><span>いい休み</span><b>2</b></button></div>`
      :`<div class="stamps"><button class="stamp" data-n="3"><span>ナイス</span><b>3</b></button><button class="stamp" data-n="1"><span>前回超え</span><b>1</b></button><button class="stamp" data-n="0"><span>いっしょに</span><b>0</b></button></div>`;
    return `<article class="blk"><div class="frow"><div class="av" style="background:var(${f.c})">${ini}</div><div class="fname"><b>${f.n}</b><span>${f.t}</span></div><button class="icon-btn" aria-label="共有"><i data-lucide="share"></i></button></div><span class="pill">${f.d}</span>${body}${stamps}</article>`;
  }).join("");
}

function heat(p){
    const s=[css("--heat-1"),css("--heat-2"),css("--heat-3"),css("--heat-4")].map(h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
  const x=Math.max(0,Math.min(p,1))*3, i=Math.min(Math.floor(x),2), t=x-i;
  return "rgb("+s[i].map((v,k)=>Math.round(v+(s[i+1][k]-v)*t)).join(",")+")";
}

/* 記録 */
const PREV={w:60,r:10};
const S={cur:0,sets:[{w:60,r:10},{w:60,r:10},{w:60,r:10}],log:[],timer:null};
function render(float){
  const fin=S.cur>=S.sets.length;
  $("#setno").textContent=fin?"3/3セット　おわり":`${S.cur+1}/3セット目　前回 ${PREV.w}kg×${PREV.r}回`;
  if(!fin){const s=S.sets[S.cur];$("#bigv").innerHTML=`<b>${s.w}</b><small>kg ×</small><b id="rr" class="${s.r>PREV.r?"win":""}">${s.r}</b><small>回</small>`;}
  else $("#bigv").innerHTML="";
  $(".steps").hidden=fin;$("#done").textContent=fin?"次の種目へ":"できた";
  $("#diffs").innerHTML=S.log.map((l,i)=>{const d=l.r-PREV.r;const t=d>0?`前回 +${d}回`:d===0?"前回と同じ":`前回 −${-d}回`;return `<div class="r ${d>0?"win":""}"><span>${i+1}セット目　${l.w}kg×<span class="rn" id="lr${i}">${l.r}</span>回</span><span>${t}</span></div>`}).join("");
  if(float!=null){const el=$("#lr"+float);if(el){el.style.position="relative";const f=document.createElement("span");f.className="float";f.textContent="+"+(S.log[float].r-PREV.r);el.appendChild(f);setTimeout(()=>f.remove(),700);}}
  icons();
}
function startTimer(){
  clearInterval(S.timer);let t=90;const show=()=>$("#timer").textContent=`休憩 ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;show();
  S.timer=setInterval(()=>{t--;if(t<=0){clearInterval(S.timer);$("#timer").textContent="休憩おわり";}else show();},1000);
}
$("#wm").onclick=()=>{S.sets[S.cur].w-=2.5;render();};
$("#wp").onclick=()=>{S.sets[S.cur].w+=2.5;render();};
$("#rm").onclick=()=>{S.sets[S.cur].r=Math.max(1,S.sets[S.cur].r-1);render();};
$("#rp").onclick=()=>{S.sets[S.cur].r++;render();};
$("#done").onclick=()=>{
  if(S.cur>=S.sets.length){location.hash="#today";return;}
  const s=S.sets[S.cur];S.log.push({w:s.w,r:s.r});S.cur++;
  render(s.r>PREV.r?S.log.length-1:null);startTimer();
};

/* ルーティング */
function route(){
  let h=(location.hash||"#today").slice(1);
  if(h==="today"&&st.rested)h="rest";
  if(!$("#s-"+h))h="today";
  $$(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+h));
  const scr=$("#s-"+h);
  $("#tabs").classList.toggle("off",scr.classList.contains("full"));
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===scr.dataset.tab));
  scr.scrollTop=0;
}
window.addEventListener("hashchange",route);
